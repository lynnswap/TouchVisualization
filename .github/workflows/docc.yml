name: DocC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate DocC
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -workspace TouchVisualization.xcworkspace \
            -scheme TouchVisualization \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docc \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_DOCC_FLAGS='--warnings-as-errors'
          xcrun docc process-archive transform-for-static-hosting \
            .build/docc/Build/Products/Debug-iphonesimulator/TouchVisualization.doccarchive \
            --hosting-base-path TouchVisualization \
            --output-path .build/docs
          touch .build/docs/.nojekyll

      - name: Archive Pages artifact
        run: tar -C .build/docs -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
