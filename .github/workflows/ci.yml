name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test-ios-16:
        description: Install iOS 16.4 and test Objective-C class enumeration
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-16-compatibility:
    name: Test class enumeration on iOS 16.4
    if: github.event_name == 'workflow_dispatch' && inputs.test-ios-16
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and boot iOS 16.4
        run: |
          xcodebuild -version
          xcodebuild -downloadPlatform iOS -buildVersion 16.4
          udid=$(xcrun simctl create "iOS 16 compatibility" com.apple.CoreSimulator.SimDeviceType.iPhone-14 com.apple.CoreSimulator.SimRuntime.iOS-16-4)
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b

      - name: Run the class enumeration regression test
        run: |
          xcodebuild test \
            -workspace TouchVisualization.xcworkspace \
            -scheme TouchVisualizationTests \
            -testPlan TouchVisualizationTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            '-only-testing:TouchVisualizationTests/TouchVisualizationTests/enumeratingClassesDoesNotRequireObservation()' \
            CODE_SIGNING_ALLOWED=NO

  script-tests:
    name: Workflow script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

  package-tests:
    name: Build and test on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Check Swift formatting
        run: xcrun swift-format lint --configuration .swift-format --strict --recursive Package.swift Sources Tests Examples/TouchVisualizationDemo/TouchVisualizationDemo

      - name: Create an iOS Simulator
        run: python3 .github/scripts/create-simulator.py

      - name: Start the Simulator
        run: xcrun simctl boot "$SIMULATOR_UDID"

      - name: Build package tests
        run: |
          set -e -o pipefail
          xcodebuild build-for-testing \
            -workspace TouchVisualization.xcworkspace \
            -scheme TouchVisualizationTests \
            -testPlan TouchVisualizationTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Run package tests
        run: |
          set -e -o pipefail
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild test-without-building \
            -workspace TouchVisualization.xcworkspace \
            -scheme TouchVisualizationTests \
            -testPlan TouchVisualizationTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/tests.log"

      - name: Build the example in Debug and Release
        run: |
          for configuration in Debug Release; do
            xcodebuild build \
              -workspace TouchVisualization.xcworkspace \
              -scheme TouchVisualizationDemo \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/tests.xcresult
          retention-days: 1
          if-no-files-found: ignore

      - name: Delete the test Simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: xcrun simctl delete "$SIMULATOR_UDID"
