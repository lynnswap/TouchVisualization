name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-tests:
    name: Workflow script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

  package-tests:
    name: Build and test on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Check Swift formatting
        run: xcrun swift-format lint --configuration .swift-format --strict --recursive Package.swift Sources Tests Examples/TouchVisualizationDemo/TouchVisualizationDemo

      - name: Create an iOS Simulator
        run: python3 .github/scripts/create-simulator.py

      - name: Boot the Simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run package tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace TouchVisualization.xcworkspace \
            -scheme TouchVisualizationTests \
            -testPlan TouchVisualizationTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/tests.log"

      - name: Build the example in Debug and Release
        run: |
          for configuration in Debug Release; do
            xcodebuild build \
              -workspace TouchVisualization.xcworkspace \
              -scheme TouchVisualizationDemo \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Delete the test Simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: xcrun simctl delete "$SIMULATOR_UDID"
